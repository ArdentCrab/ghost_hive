name: Ghost Hive CI

on:
  push:
  pull_request:

jobs:
  test-redteam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y g++ make python3

      - name: make test
        run: make test

      - name: make redteam
        run: make redteam
